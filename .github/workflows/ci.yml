name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel outdated runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test + coverage (100% threshold on the logic surface)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Overframe ships Windows-only with native modules (better-sqlite3, uiohook-napi,
  # koffi). The ubuntu job above is fast feedback; this validates the real target:
  # native rebuild + typecheck + bundle on Windows.
  build-windows:
    name: Build (Windows / native modules)
    # Pinned: windows-latest moved to VS2026 (v18), which node-gyp can't use and
    # which contradicts our .npmrc msvs_version=2022. windows-2022 ships VS2022,
    # matching the documented local requirement (VS Build Tools 2022).
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (rebuilds native modules for Windows)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
